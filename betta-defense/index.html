<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betta: Guardião do Titanic</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        /* HUD sobreposta */
        #hud { position: absolute; top: 10px; left: 10px; color: white; font-family: sans-serif; font-size: 20px; text-shadow: 2px 2px 0 #000; z-index: 10; }
        /* Tela de Game Over */
        #game-over-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); color: white; justify-content: center; align-items: center; flex-direction: column; z-index: 20; }
        button { margin-top: 20px; padding: 10px 20px; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Onde o WebGL 2 vai renderizar o jogo -->
        <canvas id="game-canvas"></canvas>
        
        <div id="hud">
            <div>HP: <span id="hp-value">100</span></div>
            <div>Score: <span id="score-value">0</span></div>
        </div>

        <div id="game-over-screen">
            <h1>O Titanic foi tomado!</h1>
            <button id="restart-btn">Reiniciar</button>
        </div>
    </div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
