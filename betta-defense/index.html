<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Betta: Guardião do Titanic</title>
    <link rel="stylesheet" href="styles/hud.css?v=4">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <button id="sound-toggle" class="sound-toggle" type="button"
                aria-label="Ativar som" aria-pressed="false" title="Ativar som">
            <svg viewBox="0 0 32 32" aria-hidden="true">
                <path class="speaker" d="M5 12h6l7-6v20l-7-6H5z"/>
                <path class="sound-waves" d="M22 11c2.5 2.7 2.5 7.3 0 10M25 7c5 5 5 13 0 18"/>
                <path class="mute-slash" d="M22 12l7 8M29 12l-7 8"/>
            </svg>
        </button>

        <div class="version-label">
            [version 0.9.1 (you are a <strong>betta</strong> tester)]
        </div>
        
        <!-- TELA INICIAL (MENU) -->
        <div id="start-screen" class="overlay-screen">
            <h1 class="game-title">Betta Defense</h1>
            <div class="menu-buttons">
                <button id="btn-play" class="ui-btn">Jogar</button>
                <button id="btn-credits" class="ui-btn">Créditos</button>
            </div>
        </div>

        <!-- TELA DE CRÉDITOS -->
        <div id="credits-screen" class="overlay-screen" style="display: none;">
            <h1 class="game-title">Créditos</h1>
            <div class="credits-content">
                <p><strong>Desenvolvimento:</strong> ...</p>
                <p><strong>Artes:</strong> ....</p>
                <p><strong>Motor:</strong> WebGL 2</p>
            </div>
            <button id="btn-back" class="ui-btn">Voltar ao Menu</button>
        </div>

        <!-- HUD DO JOGO -->
        <div id="hud" style="display: none;">
            <canvas id="betta-life-art" class="hud-life-art" width="160" height="100" role="img"
                    aria-label="Vida do Betta: 100 de 100"></canvas>
            <canvas id="tower-life-art" class="hud-life-art" width="160" height="100" role="img"
                    aria-label="Vida do Titanic: 400 de 400"></canvas>
            <div class="hud-score-art" role="group" aria-label="Pontuação do jogador">
                <canvas id="score-art" width="120" height="100" aria-hidden="true"></canvas>
                <span id="score-value" class="hud-score-value">0</span>
            </div>
        </div>

        <!-- TELA DE GAME OVER -->
        <div id="game-over-screen" class="overlay-screen" style="display: none;">
            <h1 class="game-title">Fim de jogo</h1>
            <p id="game-over-message" class="game-over-message"></p>
            <button id="restart-btn" class="ui-btn">Reiniciar</button>
            <button id="menu-btn" class="ui-btn">Voltar ao menu principal</button>
        </div>
    </div>
    <script type="module" src="src/main.js?v=4"></script>
</body>
</html>
